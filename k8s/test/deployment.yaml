apiVersion: apps/v1
kind: Deployment
metadata:
  name: hdkitservice
  namespace: huaweicloud-agent
  labels:
    app: hdkitservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hdkitservice
  template:
    metadata:
      labels:
        app: hdkitservice
    spec:
      imagePullSecrets:
        - name: swr-secret
      containers:
        - name: server
          # TODO: 替换为带本次改动构建的测试镜像 tag
          image: swr.cn-south-1.myhuaweicloud.com/huaweicloud-agent/hdkitservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              protocol: TCP
          volumeMounts:
            - name: log-volume
              mountPath: /opt/cloud/logs/hdkitservice
          env:
            - name: PORT
              value: "3001"
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MYSQL_PORT
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MYSQL_DATABASE
            - name: TEMPLATE_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: TEMPLATE_ID
            - name: FLAVOR_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: FLAVOR_ID
            - name: INCENTIVE_CHECK_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INCENTIVE_CHECK_URL
            - name: INCENTIVE_ISSUE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INCENTIVE_ISSUE_URL
            - name: INCENTIVE_APPCODE
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INCENTIVE_APPCODE
            - name: INCENTIVE_HW_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INCENTIVE_HW_ID
            - name: INCENTIVE_APPKEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INCENTIVE_APPKEY
            - name: INCENTIVE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INCENTIVE_AUTH_TOKEN
            - name: INCENTIVE_FACE_AMOUNT
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INCENTIVE_FACE_AMOUNT
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: log-volume
          persistentVolumeClaim:
            claimName: hdkitservice-logs