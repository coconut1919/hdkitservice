name: CD Production

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: swr.cn-south-1.myhuaweicloud.com
  IMAGE: huaweicloud-devkit-prod/hdkitservice
  NAMESPACE: backend
  CLUSTER: cce-hd-devkit-prod
  WORKLOAD: hdkitservice

jobs:
  build-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & Test
        run: mvn -B package

      - name: Login SWR
        env:
          SWR_USER: ${{ secrets.SWR_USER }}
          SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
        run: echo "$SWR_PASSWORD" | docker login -u "$SWR_USER" --password-stdin $REGISTRY

      - name: Build & Push image
        run: |
          docker build -t $REGISTRY/$IMAGE:${{ github.ref_name }} .
          docker push $REGISTRY/$IMAGE:${{ github.ref_name }}

  deploy:
    needs: build-push
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy to CCE (${{ env.CLUSTER }})
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BUILD_HOST }}
          username: ${{ secrets.BUILD_USER }}
          password: ${{ secrets.BUILD_PASSWORD }}
          script: |
            kubectl --kubeconfig=/tmp/kubeconfig.json -n ${{ env.NAMESPACE }} \
              set image deployment/${{ env.WORKLOAD }} \
              server=${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.ref_name }}
            kubectl --kubeconfig=/tmp/kubeconfig.json -n ${{ env.NAMESPACE }} \
              rollout status deployment/${{ env.WORKLOAD }} --timeout=120s
