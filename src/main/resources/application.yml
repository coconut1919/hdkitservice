server:
  port: ${PORT:3001}
spring:
  application:
    name: hdkitservice
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hdkitservice}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

hdkit:
  telemetry:
    salt: "${TELEMETRY_SALT:changeme}"

dashboard:
  npm-package-name: "${DASHBOARD_NPM_PACKAGE_NAME:@huaweicloud/huaweicloud-devkit}"
  npm-publish-date: "${DASHBOARD_NPM_PUBLISH_DATE:2025-01-01}"
  npm-api-base: "${DASHBOARD_NPM_API_BASE:https://api.npmjs.org}"
  aggregation-enabled: "${DASHBOARD_AGGREGATION_ENABLED:true}"
  npm-fetch-enabled: "${DASHBOARD_NPM_FETCH_ENABLED:true}"
