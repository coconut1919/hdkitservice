spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

hdkit:
  telemetry:
    salt: "test-salt"

dashboard:
  npm-package-name: "@huaweicloud/huaweicloud-devkit"
  npm-publish-date: "2025-01-01"
  npm-api-base: "https://api.npmjs.org"
  aggregation-enabled: false
  npm-fetch-enabled: false
